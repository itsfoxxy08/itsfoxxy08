name: Update profile hero

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh profile statistics
        run: node scripts/update-profile-hero.mjs

      - name: Commit updated profile statistics
        run: |
          if git diff --quiet -- README.md assets/profile-hero.svg; then
            echo "Profile statistics have not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/profile-hero.svg
          git commit -m "Update profile statistics"
          git push
