name: Deploy interactive contribution city

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload interactive city site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy interactive city site
        uses: actions/deploy-pages@v4
