name: Update contribution city

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-contribution-city:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh contribution city
        run: node scripts/update-contribution-city.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload interactive city site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy interactive city site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit updated contribution city
        run: |
          if git diff --quiet -- README.md assets/contribution-city.svg; then
            echo "Contribution city has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/contribution-city.svg
          git commit -m "Update contribution city"
          git push
