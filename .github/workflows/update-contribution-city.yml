name: Update contribution city

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-contribution-city:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh contribution city
        run: node scripts/update-contribution-city.mjs

      - name: Commit updated contribution city
        run: |
          if git diff --quiet -- README.md assets/contribution-city.svg site/contributions.json; then
            echo "Contribution city has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/contribution-city.svg site/contributions.json
          git commit -m "Update contribution city"
          git push

      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/pages.json" --write-out "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")"

          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "GitHub Pages is not enabled; automatic city refresh completed, deployment skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/pages.json"
            echo "Could not check GitHub Pages configuration (HTTP $status)." >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload interactive city site
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy interactive city site
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
